  /* प्रोजेक्ट्स कंटेनर को ग्रिड से हटाकर सीधे वर्टिकल कॉलम में बदलें */
  .work .box-container {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    max-width: 1100px !important;
    margin: 0 auto !important;
    padding: 2rem !important;
  }

  /* प्रत्येक प्रोजेक्ट बॉक्स को होम स्क्रीन स्टाइल के साथ फुल-स्क्रीन (पूरी चौड़ाई) दें */
  .work .box-container .box {
    width: 100% !important;
    max-width: 1000px !important;
    margin: 0 0 4rem 0 !important; /* नीचे की तरफ स्पेस */
    box-sizing: border-box !important;
  }

  /* सुनिश्चित करें कि इमेज कार्ड की चौड़ाई के हिसाब से पूरी तरह फिट हो */
  .work .box-container .box img {
    width: 100% !important;
    height: auto !important;
    max-height: 450px !important;
    object-fit: contain !important;
  }
</style>
